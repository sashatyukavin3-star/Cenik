name: Build Cenik APK

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::Android project ZIP not found in repository"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf project
          mkdir -p project
          unzip -q "$ZIP" -d project

          # Detect the actual Android project root.
          if [ -f "project/settings.gradle.kts" ] || [ -f "project/settings.gradle" ]; then
            ROOT="project"
          else
            ROOT="$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"
          fi

          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "::error::settings.gradle(.kts) not found after extracting ZIP"
            find project -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          if [ ! -d "$ROOT/app" ]; then
            echo "::error::Android app module not found: $ROOT/app"
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Detected project root: $ROOT"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "Gradle wrapper is missing; generating it..."
            gradle wrapper --gradle-version 8.13
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Build release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "${PROJECT_ROOT}/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced"
            find "${PROJECT_ROOT}/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p artifact
          cp "$APK" artifact/cenik-release.apk
          echo "APK: $APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cenik-release-apk
          path: artifact/cenik-release.apk
          if-no-files-found: error
