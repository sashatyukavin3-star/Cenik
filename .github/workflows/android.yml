name: Build Cenik APK

on:
  push:
    paths:
      - "cenik-v1-final.zip"
      - "cenik.zip"
      - "*.zip"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          test -n "$ZIP"
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

          # If ZIP contains a single top-level directory, use it as project root.
          if [ "$(find project -mindepth 1 -maxdepth 1 -type d | wc -l)" = "1" ] &&              [ "$(find project -mindepth 1 -maxdepth 1 -type f | wc -l)" = "0" ]; then
            ROOT="$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          else
            ROOT="project"
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          test -f "$ROOT/settings.gradle.kts" -o -f "$ROOT/settings.gradle"
          test -f "$ROOT/build.gradle.kts" -o -f "$ROOT/build.gradle"
          test -d "$ROOT/app"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${PROJECT_ROOT}/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" artifact/cenik-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cenik-release-apk
          path: artifact/cenik-release.apk
          if-no-files-found: error
